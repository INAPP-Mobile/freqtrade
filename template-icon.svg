<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1e3a"/>
      <stop offset="1" stop-color="#12325e"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- candlesticks: wick + body, green/red -->
  <g stroke-width="10" stroke-linecap="round">
    <line x1="64" y1="58" x2="64" y2="150" stroke="#22c55e"/>
    <line x1="128" y1="86" x2="128" y2="178" stroke="#22c55e"/>
    <line x1="192" y1="106" x2="192" y2="198" stroke="#ef4444"/>
  </g>
  <g>
    <rect x="46" y="82" width="36" height="52" rx="6" fill="#22c55e"/>
    <rect x="110" y="110" width="36" height="50" rx="6" fill="#22c55e"/>
    <rect x="174" y="130" width="36" height="54" rx="6" fill="#ef4444"/>
  </g>
  <!-- trend line with node dots -->
  <polyline points="52,150 116,122 180,96 236,72" fill="none" stroke="#facc15" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="52" cy="150" r="9" fill="#facc15"/>
  <circle cx="116" cy="122" r="9" fill="#facc15"/>
  <circle cx="180" cy="96" r="9" fill="#facc15"/>
  <circle cx="236" cy="72" r="9" fill="#facc15"/>
</svg>